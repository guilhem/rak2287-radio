name: Release sx130x-kiss

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency: sx130x-kiss-release

jobs:
  release:
    runs-on: ubuntu-24.04
    container: rust:1.85.0-bookworm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release prerequisites
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || { echo 'Set HOMEBREW_TAP_TOKEN before tagging a release.' >&2; exit 1; }
          git ls-remote --exit-code origin refs/heads/nix

      - name: Prepare the build
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross jq
          git submodule update --init deps/hal deps/usp
          cargo_version=$(cargo metadata --no-deps --locked --format-version 1 | jq -er '.packages[] | select(.name == "sx130x-kiss") | .version')
          test "v$cargo_version" = "$GITHUB_REF_NAME" || { echo 'The release tag must match the version in Cargo.toml.' >&2; exit 1; }

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-about@0.9.3
          fallback: none

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
