name: Linux radio simulation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulate:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false
      - run: make -j2 check
      - run: make -j2 kiss
      - run: make -j2 bench-handover
      - run: make -j2 radio-repeater
